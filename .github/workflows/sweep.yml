name: Sweep Starknet ecosystem

on:
  schedule:
    # Heartbeat only — the loop below is what sets the real cadence. See the
    # registry workflow for why a schedule alone is not enough.
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Independent of the registry loop so a slow sweep can never delay a rescue.
concurrency:
  group: sweep-loop
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Discover repos and sweep them in slices
        env:
          DISCOVER: https://aegis-peach-six.vercel.app/api/discover
          SWEEP: https://aegis-peach-six.vercel.app/api/scan-sweep
          # Repos per sweep run. Measured on the deployed function: 200 repos
          # took 23.6s, i.e. ~118ms each, so this uses about a fifth of the
          # 120s budget and leaves room for slow repos.
          BATCH: "200"
          # Seconds between sweeps. 24s of work every 10 minutes is a ~4% duty
          # cycle, and walks the whole discovered set (~5k repos) in about four
          # hours. Deliberately unhurried: these repos never asked to be
          # watched, and nothing here is time-critical because the sweep only
          # reports — the rescue path is the registry scan, which runs on its
          # own much faster loop.
          SLEEP: "600"
          # Search is the one hard limit. GITHUB_TOKEN is set on the
          # deployment, which raises it from 10 to 30 requests/min (confirmed
          # from the x-ratelimit-remaining header), so a run can walk a full
          # 10-page query without getting close to the ceiling.
          DISCOVER_PAGES: "10"
          # One discovery burst per hour. The queue only needs topping up with
          # newly created repos once it has been built out, and a throttled run
          # now resumes on the same page instead of skipping a query.
          DISCOVER_EVERY: "6"
          # PR scanning is the only part that spends the core API quota: one
          # call per repo, ~200 repos per run (the whole registry plus a
          # rotating slice). Every third iteration is roughly twice an hour,
          # so ~400 calls/hr against a 5000/hr ceiling.
          PRS: https://aegis-peach-six.vercel.app/api/scan-prs
          PR_BATCH: "60"
          PR_EVERY: "3"
          RUN_FOR: "3000"
        run: |
          end=$((SECONDS + RUN_FOR))
          i=0
          while [ "$SECONDS" -lt "$end" ]; do
            if [ $((i % DISCOVER_EVERY)) -eq 0 ]; then
              curl -sf --max-time 90 "$DISCOVER?pages=$DISCOVER_PAGES" -o /dev/null \
                && echo "discover ok $(date -u +%H:%M:%S)" \
                || echo "discover fail $(date -u +%H:%M:%S)"
            fi
            if curl -sf --max-time 150 "$SWEEP?batch=$BATCH" -o /dev/null; then
              echo "sweep ok   $(date -u +%H:%M:%S)"
            else
              echo "sweep fail $(date -u +%H:%M:%S)"
            fi
            i=$((i + 1))
            sleep "$SLEEP"
          done
