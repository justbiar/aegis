name: Scan registry

on:
  schedule:
    # Heartbeat: GitHub throttles scheduled runs (often 15-30 min apart), so this
    # only restarts the loop below if it ever stops — it isn't the scan cadence.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Keep exactly one looping run alive. While it runs, scheduled triggers become a
# single pending run that takes over the moment the current loop ends — so the
# scan cadence stays continuous instead of waiting for GitHub's delayed schedule.
concurrency:
  group: scan-loop
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # The scan runs HERE, on the runner, not by asking the website to do it.
      #
      # It used to be a curl at an endpoint, which charged every pass to the
      # same CPU allowance that serves the site. The scanning is by far the
      # heavier half — roughly 1200 file reads, entropy and Stark-curve checks
      # per pass — so the site's own budget went on scanning and the host
      # eventually paused the deployment. That trade is backwards: it stopped
      # the product to keep the bot running. Runner minutes are free on a public
      # repository, and the result reaches the site the same way either way,
      # through KV.
      - name: Scan continuously
        env:
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          PROVIDER_URL: ${{ secrets.PROVIDER_URL }}
          SAFE_WALLET_ADDRESS: ${{ secrets.SAFE_WALLET_ADDRESS }}
          SAFE_WALLET_ADDRESS_MAINNET: ${{ secrets.SAFE_WALLET_ADDRESS_MAINNET }}
          # Raises GitHub's rate limit for the pull-request pass. Provided by
          # Actions itself, so there is nothing to configure.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Seconds between full scans, and between fast-lane re-checks of the
          # repos already known to be leaking. The full pass is what costs; the
          # fast lane is about a thousandth of it, which is why it can run in
          # between.
          SLEEP: "900"
          HOT_SLEEP: "180"
          HOT_PER_CYCLE: "5"
          # Loop for ~5h45m, just inside the 6-hour ceiling on a job. GitHub's
          # `schedule` is best-effort and drifted to 11-18 hours between starts,
          # which left the scanner up about 6% of the day, so a run lasts as
          # long as one job may and hands off to the next itself below.
          RUN_FOR: "20700"
        run: |
          end=$((SECONDS + RUN_FOR))
          while [ "$SECONDS" -lt "$end" ]; do
            npm run --silent scan || echo "scan failed $(date -u +%H:%M:%S)"
            h=0
            while [ "$h" -lt "$HOT_PER_CYCLE" ] && [ "$SECONDS" -lt "$end" ]; do
              sleep "$HOT_SLEEP"
              npm run --silent scan -- --hot || echo "hot failed $(date -u +%H:%M:%S)"
              h=$((h + 1))
            done
          done

      # GitHub's scheduler is the weak link, not the loop: `schedule` is
      # best-effort and gets deprioritised, so waiting for it leaves hours where
      # nothing is watching. A run that ends starts the next one itself, which
      # makes the chain continuous rather than dependent on when GitHub feels
      # like firing. This needs a PAT: a workflow_dispatch authenticated with
      # the built-in GITHUB_TOKEN deliberately does not start a new run, so that
      # a workflow cannot trigger itself by accident.
      #
      # Optional. Without the secret this step does nothing and the schedule
      # remains the only trigger — the loop still runs, just with gaps.
      # To enable: create a fine-grained PAT scoped to this repository with
      # Actions: read and write, then add it as the LOOP_PAT secret.
      - name: Start the next run
        if: always()
        env:
          LOOP_PAT: ${{ secrets.LOOP_PAT }}
        run: |
          if [ -z "$LOOP_PAT" ]; then
            echo "No LOOP_PAT secret set — leaving the next start to GitHub's schedule."
            exit 0
          fi
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $LOOP_PAT" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scan.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}' \
            && echo "next run dispatched" \
            || echo "dispatch failed — the schedule is still the fallback"
