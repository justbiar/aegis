name: Scan registry

on:
  schedule:
    # Heartbeat: GitHub throttles scheduled runs (often 15-30 min apart), so this
    # only restarts the loop below if it ever stops — it isn't the scan cadence.
    - cron: "*/5 * * * *"
  workflow_dispatch:

# Keep exactly one looping run alive. While it runs, scheduled triggers become a
# single pending run that takes over the moment the current loop ends — so the
# scan cadence stays continuous instead of waiting for GitHub's delayed schedule.
concurrency:
  group: scan-loop
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Continuously trigger the registry scan
        env:
          URL: https://aegis-peach-six.vercel.app/api/scan-registry
          # The fast lane: re-checks only the repos already known to be leaking.
          # A full pass reads ~1200 files to answer "is anyone leaking?"; this
          # answers "is the known leak funded yet?" in a handful of reads, so it
          # can run every few seconds without moving the quota needle.
          HOT: https://aegis-peach-six.vercel.app/api/scan-hot
          # Seconds between full scans. Lower = new leaks found sooner, but more
          # load on Alchemy (RPC compute units) and Vercel (function execution) —
          # those quotas, not GitHub, are the real limit. Tune here.
          #
          # This was 90s, which is ~960 full scans and ~5,800 fast-lane checks a
          # day. That is the pace that exhausted the hosting plan's monthly
          # function budget and left the whole deployment returning 402, so the
          # scanner ran often and the site did not run at all. A watch nobody can
          # reach is worth less than a slower one that stays up.
          SLEEP: "900"
          # Seconds between hot checks, and how many fit inside one SLEEP.
          # 5 x 180s = the 900s above; keep them consistent when tuning.
          HOT_SLEEP: "180"
          HOT_PER_CYCLE: "5"
          # Loop for ~5h45m, just inside the 6-hour ceiling on a job. This used
          # to be 50 minutes on the assumption that the */5 heartbeat restarts it
          # promptly. It does not: starts were ~15 minutes apart until 26 Aug and
          # then 11-18 hours apart, which left the scanner up about 6% of the day
          # and a leak funded in the gap sitting there until someone loaded the
          # site. Minutes are free on a public repo, so the loop runs as long as
          # one job is allowed to, and the handoff step below closes the rest.
          RUN_FOR: "20700"
        run: |
          end=$((SECONDS + RUN_FOR))
          while [ "$SECONDS" -lt "$end" ]; do
            if curl -sf --max-time 150 "$URL" -o /dev/null; then
              echo "scan ok   $(date -u +%H:%M:%S)"
            else
              echo "scan fail $(date -u +%H:%M:%S)"
            fi
            # Fill the gap until the next full scan with fast-lane checks rather
            # than sleeping through it. This is what closes the window between
            # someone funding a leaked wallet and the sweep.
            h=0
            while [ "$h" -lt "$HOT_PER_CYCLE" ] && [ "$SECONDS" -lt "$end" ]; do
              sleep "$HOT_SLEEP"
              curl -sf --max-time 25 "$HOT" -o /dev/null \
                || echo "hot fail  $(date -u +%H:%M:%S)"
              h=$((h + 1))
            done
          done

      # GitHub's scheduler is the weak link, not the loop: `schedule` is
      # best-effort and gets deprioritised, so waiting for it leaves hours where
      # nothing is watching. A run that ends starts the next one itself, which
      # makes the chain continuous rather than dependent on when GitHub feels
      # like firing. This needs a PAT: a workflow_dispatch authenticated with
      # the built-in GITHUB_TOKEN deliberately does not start a new run, so that
      # a workflow cannot trigger itself by accident.
      #
      # Optional. Without the secret this step does nothing and the schedule
      # remains the only trigger — the loop still runs, just with gaps.
      # To enable: create a fine-grained PAT scoped to this repository with
      # Actions: read and write, then add it as the LOOP_PAT secret.
      - name: Start the next run
        if: always()
        env:
          LOOP_PAT: ${{ secrets.LOOP_PAT }}
        run: |
          if [ -z "$LOOP_PAT" ]; then
            echo "No LOOP_PAT secret set — leaving the next start to GitHub's schedule."
            exit 0
          fi
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $LOOP_PAT" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/scan.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}' \
            && echo "next run dispatched" \
            || echo "dispatch failed — the schedule is still the fallback"
